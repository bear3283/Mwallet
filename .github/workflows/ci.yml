name: CI

# PR 에서만 돈다. main 으로의 push 에서는 돌지 않는다.
#
# 이 저장소는 비공개라 Actions 분이 무료 한도에서 깎이고, iOS 빌드라
# macos 러너를 써야 하는데 macos 는 분당 10배로 계산된다. 한 번 도는 데
# 5분이니 실제로는 50분씩 빠져나간다. 무료 한도 2,000분이면 40회 남짓이다.
#
# push 와 pull_request 를 함께 걸어 두면 PR 한 건이 두 번 돈다 — PR 에서
# 한 번, 머지 커밋에서 또 한 번. 머지 커밋의 내용은 PR 에서 이미 검증한
# 것과 같으므로 두 번째는 버리는 셈이다. 이것만 빼도 사용량이 절반이 된다.
#
# 대신 main 이 깨졌는지 자동으로 알 수 없다. PR 을 머지하기 전에 base 를
# 최신 main 으로 맞추면(gh pr update-branch) 검증한 것과 머지될 것이
# 같아지므로, 그 습관으로 메운다. 손으로 돌려야 할 때는 아래
# workflow_dispatch 로 Actions 탭에서 실행한다.
on:
  # base 를 제한하지 않는다. 제한하면 PR 위에 쌓은 PR 이 CI 를 타지 못한다.
  pull_request:
    # 문서만 고친 PR 에 5분짜리 macos 빌드를 돌리지 않는다.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 빌드 · 린트 · 테스트
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # 환율 API 키는 저장소에 없다. CI 에서는 빈 키로 빌드만 통과시킨다.
      # 네트워크를 타는 코드는 테스트 대상이 아니라 값이 없어도 문제되지 않는다.
      # 실제 키가 필요해지면 저장소 Secrets 에 EXCHANGERATE_API_KEY 를 넣는다.
      - name: 시크릿 설정
        run: |
          cp Mwallet/View/Config.xcconfig.example Mwallet/View/Config.xcconfig
          if [ -n "${{ secrets.EXCHANGERATE_API_KEY }}" ]; then
            echo "API_KEY = ${{ secrets.EXCHANGERATE_API_KEY }}" > Mwallet/View/Config.xcconfig
          fi

      # SPM 의존성(lottie-ios, SwiftLintPlugins)을 매번 새로 받지 않는다.
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # SwiftLint 는 빌드 플러그인으로 함께 돈다. 위반이 있으면 경고로 찍힌다.
      # 서명은 CI 에서 할 수 없으므로 끈다.
      - name: 빌드 및 테스트
        run: |
          set -o pipefail
          xcodebuild test \
            -project Mwallet.xcodeproj \
            -scheme Mwallet \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation \
            -skip-testing:MwalletUITests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      # 린트 위반을 눈에 띄게 남긴다. 빌드 로그에 묻히지 않도록 따로 센다.
      - name: 위젯 타깃 빌드
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mwallet.xcodeproj \
            -scheme MwalletWidgetExtension \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
