name: CI

# 손으로 돌릴 때만 도는 워크플로다. 저절로 도는 일은 없다.
#
# 자동 실행을 끈 이유는 값이 안 나와서다. 이 저장소는 비공개라 Actions 분이
# 무료 한도에서 깎이고, iOS 빌드라 macos 러너를 써야 하는데 macos 는 분당
# 10배로 계산된다. 한 번 도는 데 5분이니 실제로는 50분씩 빠져나가, 무료
# 한도 2,000분이면 40회 남짓이 전부다. 8월에 31회 만에 한도가 닿았다.
#
# 그 값을 치르고 얻는 것이 크지 않다. 여기서 하는 일(빌드·린트·테스트)은
# 손안의 기계에서 몇 분이면 끝나고, 머지 전에 늘 그렇게 확인하고 있다.
#
# 그래도 파일을 지우지 않은 것은, 이것이 '이 프로젝트를 깨끗한 기계에서
# 빌드하는 법' 의 기록이기 때문이다. Config.xcconfig 를 example 에서
# 만들어 내는 것, SPM 캐시 키, UI 테스트를 빼는 것, 서명을 끄는 것,
# 패키지 플러그인 검증을 건너뛰는 것 — 한 번에 알아낼 수 없는 값들이다.
#
# 돌려야 할 때: Actions 탭 → CI → Run workflow.
#   - 배포 전, 내 기계 밖에서도 빌드되는지 보고 싶을 때
#   - 다른 사람이 저장소를 받아 갈 때
#   - 결제 한도를 푼 뒤 한 번 훑을 때
#
# 자동 실행을 되살리려면 아래에 pull_request: 를 더한다.
# 그때는 paths-ignore 로 문서만 고친 PR 을 빼는 편이 좋다.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 빌드 · 린트 · 테스트
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # 환율 API 키는 저장소에 없다. CI 에서는 빈 키로 빌드만 통과시킨다.
      # 네트워크를 타는 코드는 테스트 대상이 아니라 값이 없어도 문제되지 않는다.
      # 실제 키가 필요해지면 저장소 Secrets 에 EXCHANGERATE_API_KEY 를 넣는다.
      - name: 시크릿 설정
        run: |
          cp Mwallet/View/Config.xcconfig.example Mwallet/View/Config.xcconfig
          if [ -n "${{ secrets.EXCHANGERATE_API_KEY }}" ]; then
            echo "API_KEY = ${{ secrets.EXCHANGERATE_API_KEY }}" > Mwallet/View/Config.xcconfig
          fi

      # SPM 의존성(lottie-ios, SwiftLintPlugins)을 매번 새로 받지 않는다.
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # SwiftLint 는 빌드 플러그인으로 함께 돈다. 위반이 있으면 경고로 찍힌다.
      # 서명은 CI 에서 할 수 없으므로 끈다.
      - name: 빌드 및 테스트
        run: |
          set -o pipefail
          xcodebuild test \
            -project Mwallet.xcodeproj \
            -scheme Mwallet \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation \
            -skip-testing:MwalletUITests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      # 린트 위반을 눈에 띄게 남긴다. 빌드 로그에 묻히지 않도록 따로 센다.
      - name: 위젯 타깃 빌드
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mwallet.xcodeproj \
            -scheme MwalletWidgetExtension \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
