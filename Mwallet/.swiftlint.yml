# 아래 룰들은 옛 코드가 한꺼번에 걸려 꺼 두었다.
# 걸리는 곳을 다 걷어낸 룰부터 하나씩 다시 켠다.
#
# 켠 것: function_body_length, cyclomatic_complexity, type_body_length
#
# type_body_length 를 켜면서 화면 일곱을 쪼갰다. 남은 예외는 두 뷰모델
# 뿐이고, 그 자리에 왜 남겼는지를 코드에 한 줄로 적어 뒀다.
# 룰을 통째로 끄면 새로 쓰는 코드까지 함께 풀리지만, 그 자리에만 적어
# 두면 예외가 몇 개인지 눈에 보이고 지울 때도 그 줄만 지우면 된다.

disabled_rules:
    - deployment_target
    - file_length
    - function_parameter_count
    - leading_whitespace
    - line_length
    - trailing_whitespace
    - identifier_name
