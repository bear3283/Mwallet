# 아래 룰들은 옛 코드가 한꺼번에 걸려 꺼 두었다.
# 걸리는 곳을 다 걷어낸 룰부터 하나씩 다시 켠다.
#
# 다시 켠 것: function_body_length, cyclomatic_complexity
#   - divideVoiceSentence 386줄을 VoiceSentenceParser·KoreanNumberReader 로 옮겼다
#   - getCorrespondingArabicString 의 11갈래 switch 를 자리 번호 조회로 바꿨다
#
# 아직 남은 것: type_body_length 8곳
#   ManualRecordView 707줄 · RecordView 587줄 · AddTravelView 393줄이 크다.
#   화면 쪼개기가 끝나면 이 룰도 켠다.

disabled_rules:
    - deployment_target
    - file_length
    - function_parameter_count
    - leading_whitespace
    - line_length
    - trailing_whitespace
    - identifier_name
    - type_body_length
